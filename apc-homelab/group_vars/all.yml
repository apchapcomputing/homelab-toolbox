---
# Names and paths live here, so a rename is one edit.

# People and machines
admin_user: apc
pipeline_user: pipeline   # runs rootless Podman: n8n, Postgres, Whisper
agent_user: agent         # runs Claude Code and writes notes into the make vault
host_short: rhel10-dell
ts_fqdn: rhel10-dell.your-tailnet.ts.net
timezone: America/New_York

# Run state. Flip these to true as the manual steps in the README get done.
start_pipeline: false     # after the Podman secrets exist
start_ob_sync: false      # after `ob login` and `ob sync-setup` as the admin user (docs/obsidian-sync.md)

# Containers. Pin real tags before the first start.
n8n_version: "2.43.5"
postgres_image: docker.io/library/postgres:17.10
whisper_image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
whisper_model: Systran/faster-whisper-small
# The fetcher image is built on the server. Bump ytdlp_version when YouTube breaks it;
# the image tag follows the version and the fetcher code, so a change rebuilds it.
ytdlp_version: "2026.08.19"

# Vault
vault_root: /srv/vaults   # one git repo; each vault is a folder inside it
vault_name: make          # the vault Claude writes into (a folder name under vault_root)

# Obsidian Headless runs as the admin user. The agent edits the make vault through a
# shared group. Both vaults are shared with the agent (agent_access: true). Set false to close one.
obsidian_sync_user: "{{ admin_user }}"
obsidian_group: obsidian
obsidian_vaults:
  - { name: make, agent_access: true }
  - { name: live, agent_access: true }

# Folders kept out of the vault git repo. The agent snapshots that repo daily and the admin
# pushes it to GitHub, so anything the agent can read and is not listed here gets pushed.
vault_git_ignore:
  - live/
inbox_dir: /srv/inputs
claude_bin: /home/agent/.local/bin/claude
claude_headless_settings: /etc/brain/claude-headless.json

# Vault-relative files the pipeline run may edit besides Input/Clippings/.
# The tag guide is where Input/CLAUDE.md says new tags are recorded.
agent_extra_writable:
  - "Input/+ Guide.md"

# n8n reaches the agent over SSH with a restricted key.
# Paste the PUBLIC key here (the private half goes into n8n's SSH credential).
n8n_ssh_pubkey: ""

# Weekly push of the vault to GitHub, run as the admin user.
github_backup_url: git@github.com:youruser/your-vault.git
backup_deploy_key: "/home/{{ admin_user }}/.ssh/vaults_deploy"

# Keep SSH open on the LAN until you have confirmed Tailscale SSH works.
lan_ssh: true
