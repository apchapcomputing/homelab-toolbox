---
# Claude Code installs per user, so the agent gets its own copy and its own login.
- name: Agent cache directory
  ansible.builtin.file:
    path: "/home/{{ agent_user }}/.cache"
    state: directory
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0700"

- name: Download the Claude Code installer
  ansible.builtin.get_url:
    url: https://claude.ai/install.sh
    dest: "/home/{{ agent_user }}/.cache/claude-install.sh"
    owner: "{{ agent_user }}"
    group: "{{ agent_user }}"
    mode: "0700"

- name: Install Claude Code for the agent user
  ansible.builtin.command: "bash /home/{{ agent_user }}/.cache/claude-install.sh"
  become_user: "{{ agent_user }}"
  args:
    creates: "{{ claude_bin }}"

# Root-owned on purpose. The agent can edit anything in its own home, so a policy
# kept in ~/.claude could be rewritten by the run it is meant to limit.
- name: Directory for the headless Claude policy
  ansible.builtin.file:
    path: "{{ claude_headless_settings | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Claude Code policy for pipeline runs (scoped edits, no shell, no web)
  ansible.builtin.template:
    src: claude-headless.json.j2
    dest: "{{ claude_headless_settings }}"
    owner: root
    group: root
    mode: "0644"

- name: Forced-command script that n8n's SSH key may run
  ansible.builtin.template:
    src: brain-run.sh.j2
    dest: /usr/local/bin/brain-run
    owner: root
    group: root
    mode: "0755"

# Outside the agent's home, so nothing running as the agent can add a key.
# sshd_hardening.conf points the agent user at this file.
- name: Directory for root-owned authorized_keys
  ansible.builtin.file:
    path: /etc/ssh/authorized_keys
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Authorize n8n's key for the agent user, locked to that one script
  ansible.builtin.copy:
    content: 'command="/usr/local/bin/brain-run",restrict {{ n8n_ssh_pubkey }} n8n{{ "\n" }}'
    dest: "/etc/ssh/authorized_keys/{{ agent_user }}"
    owner: root
    group: root
    mode: "0644"
  when: n8n_ssh_pubkey | length > 0

- name: Daily local snapshot script
  ansible.builtin.template:
    src: vault-snapshot.sh.j2
    dest: /usr/local/bin/vault-snapshot
    owner: root
    group: root
    mode: "0755"

- name: Snapshot service and timer
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - vault-snapshot.service
    - vault-snapshot.timer
  register: snapshot_units

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  when: snapshot_units is changed

- name: Is the vault a git repo yet?
  ansible.builtin.stat:
    path: "{{ vault_root }}/.git"
  register: vault_git

- name: Enable the daily snapshot timer (needs the git repo)
  ansible.builtin.systemd:
    name: vault-snapshot.timer
    enabled: true
    state: started
  when: vault_git.stat.exists
