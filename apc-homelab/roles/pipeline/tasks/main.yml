---
- name: Look up the pipeline user
  ansible.builtin.getent:
    database: passwd
    key: "{{ pipeline_user }}"

- name: Remember its numeric ID
  ansible.builtin.set_fact:
    pipeline_uid: "{{ getent_passwd[pipeline_user][1] }}"

- name: Stop if n8n is not pinned and the pipeline is about to start
  ansible.builtin.assert:
    that: n8n_version != 'PIN_ME'
    fail_msg: Set n8n_version in group_vars/all.yml to a real release tag. Never use latest.
  when: start_pipeline | bool

- name: Quadlet directory
  ansible.builtin.file:
    path: "/home/{{ pipeline_user }}/.config/containers/systemd"
    state: directory
    owner: "{{ pipeline_user }}"
    group: "{{ pipeline_user }}"
    mode: "0755"
    recurse: true

# n8n writes new clippings here. The agent user may move them out, nothing else.
- name: Inbox directory (owned by the pipeline user)
  ansible.builtin.file:
    path: "{{ inbox_dir }}"
    state: directory
    owner: "{{ pipeline_user }}"
    group: "{{ pipeline_user }}"
    # Not 0750: on a directory with ACLs, the group bits are the ACL mask. 0750 would
    # cap the agent at r-x on every re-run and break the move out of the inbox.
    mode: "0770"

- name: Let the agent user read and remove inbox files
  ansible.posix.acl:
    path: "{{ inbox_dir }}"
    entity: "{{ agent_user }}"
    etype: user
    permissions: rwx
    state: present
  ignore_errors: "{{ ansible_check_mode }}"   # the inbox is not created in --check mode

- name: Same for files n8n creates later (default ACL)
  ansible.posix.acl:
    path: "{{ inbox_dir }}"
    entity: "{{ agent_user }}"
    etype: user
    permissions: rwx
    default: true
    state: present
  ignore_errors: "{{ ansible_check_mode }}"

# Outside the Quadlet directory on purpose: Quadlet should not scan the build context.
- name: Fetcher build context
  ansible.builtin.file:
    path: "/home/{{ pipeline_user }}/.config/containers/fetcher"
    state: directory
    owner: "{{ pipeline_user }}"
    group: "{{ pipeline_user }}"
    mode: "0755"

- name: Fetcher source and Containerfile
  ansible.builtin.copy:
    src: fetcher/fetcher.py
    dest: "/home/{{ pipeline_user }}/.config/containers/fetcher/fetcher.py"
    owner: "{{ pipeline_user }}"
    group: "{{ pipeline_user }}"
    mode: "0644"
  register: fetcher_source

- name: Fetcher Containerfile
  ansible.builtin.template:
    src: fetcher.Containerfile.j2
    dest: "/home/{{ pipeline_user }}/.config/containers/fetcher/Containerfile"
    owner: "{{ pipeline_user }}"
    group: "{{ pipeline_user }}"
    mode: "0644"
  register: fetcher_containerfile

- name: Quadlet files
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/home/{{ pipeline_user }}/.config/containers/systemd/{{ item }}"
    owner: "{{ pipeline_user }}"
    group: "{{ pipeline_user }}"
    mode: "0644"
  loop:
    - brain.pod
    - postgres.container
    - n8n.container
    - whisper.container
    - fetcher.build
    - fetcher.container
    - pgdata.volume
    - n8n-data.volume
    - whisper-cache.volume
  register: quadlet_files

- name: Reload the pipeline user's systemd so Quadlet regenerates its units
  ansible.builtin.systemd:
    daemon_reload: true
    scope: user
  become_user: "{{ pipeline_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pipeline_uid }}"
  when: quadlet_files is changed

- name: Start the containers (only after the Podman secrets exist)
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    state: started
    scope: user
  become_user: "{{ pipeline_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pipeline_uid }}"
  loop:
    - postgres
    - n8n
    - whisper
    - fetcher
  when: start_pipeline | bool

# Quadlet rewrites the unit, but a running container keeps its old settings. Restart the ones that changed.
- name: Restart containers whose Quadlet file changed
  ansible.builtin.systemd:
    name: "{{ item.item | regex_replace('[.]container$', '') }}.service"
    state: restarted
    scope: user
  become_user: "{{ pipeline_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pipeline_uid }}"
  loop: "{{ quadlet_files.results }}"
  loop_control:
    label: "{{ item.item }}"
  when:
    - start_pipeline | bool
    - item.changed
    - item.item is match('.*[.]container$')

# A running fetcher keeps its old image. Rebuild when the code or the yt-dlp pin changed.
- name: Rebuild and restart the fetcher after a change
  ansible.builtin.systemd:
    name: "{{ item }}.service"
    state: restarted
    scope: user
  become_user: "{{ pipeline_user }}"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pipeline_uid }}"
  loop:
    - fetcher-build
    - fetcher
  when: (start_pipeline | bool) and (fetcher_source is changed or fetcher_containerfile is changed)
