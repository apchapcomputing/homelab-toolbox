---
# Repo path differs by distro. Check https://pkgs.tailscale.com/stable/ if this 404s.
- name: Work out the Tailscale repo path
  ansible.builtin.set_fact:
    tailscale_repo_path: >-
      {{ 'fedora' if ansible_facts['distribution'] == 'Fedora'
         else ('centos/' ~ ansible_facts['distribution_major_version']) if ansible_facts['distribution'] == 'CentOS'
         else 'rhel/' ~ ansible_facts['distribution_major_version'] }}

- name: Add the Tailscale repo
  ansible.builtin.get_url:
    url: "https://pkgs.tailscale.com/stable/{{ tailscale_repo_path }}/tailscale.repo"
    dest: /etc/yum.repos.d/tailscale.repo
    mode: "0644"

- name: Install Tailscale
  ansible.builtin.dnf:
    name: tailscale
    state: present

- name: Enable tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

# Everything on the tailnet is trusted. The LAN gets nothing except what base allows.
- name: Put tailscale0 in the trusted firewalld zone
  ansible.posix.firewalld:
    zone: trusted
    interface: tailscale0
    permanent: true
    immediate: true
    state: enabled

- name: Remind about the manual login
  ansible.builtin.debug:
    msg:
      - "Run once on the laptop: sudo tailscale up --hostname={{ host_short }}"
      - "Then, once n8n is running: sudo tailscale serve --bg 5678"
